# 週次: 優先ハブのエリア SEO クラスター下書き
#
# - 自動公開しない（merge-area-clusters は人手）
# Secrets:
#   ANTHROPIC_API_KEY … 本文改善（任意。無い場合はテンプレのみ）
#   OPENAI_API_KEY    … 任意

name: SEO Area Clusters

on:
  schedule:
    - cron: '0 3 * * 1' # 毎週月曜 03:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: '生成件数'
        required: false
        default: '5'

permissions:
  contents: write
  pull-requests: write

jobs:
  area-clusters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate cluster drafts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_API_URL: https://api.mensesthe-rank.jp
        run: |
          LIMIT="${{ inputs.limit || 5 }}"
          node scripts/seo/generate-area-clusters.js --execute --limit "$LIMIT"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(seo): エリアクラスター下書き'
          title: 'SEO: エリアクラスター下書き（要レビュー）'
          body: |
            優先ハブ向けの `AREA_SEO_CLUSTER` 下書きです。

            - [ ] `content/seo/cluster-drafts/*.json` をファクトチェック
            - [ ] OK なら `node scripts/seo/merge-area-clusters.js --apply`
            - [ ] 自動マージしない / 自動公開しない

            詳細: `content/seo/README.md`
          branch: chore/seo-area-clusters
          delete-branch: true
