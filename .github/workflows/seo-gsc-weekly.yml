# 週次: GSC 取得 → 伸びワード抽出（記事生成はしない）
#
# Secrets:
#   GSC_SERVICE_ACCOUNT_JSON
#   GSC_SITE_URL（例 https://mensesthe-rank.jp/）
# 未設定時はジョブをスキップ

name: SEO GSC Weekly

on:
  schedule:
    - cron: '0 2 * * 1' # 毎週月曜 02:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback days'
        required: false
        default: '28'

permissions:
  contents: write
  pull-requests: write

jobs:
  gsc-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save googleapis

      - name: Fetch GSC
        id: fetch
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::GSC_SERVICE_ACCOUNT_JSON 未設定のためスキップ"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GSC_SITE_URL="${GSC_SITE_URL:-https://mensesthe-rank.jp/}"
          LABEL=$(date -u +%Y-%m-%d)
          node scripts/seo/fetch-gsc-queries.js --api --days "${{ inputs.days || 28 }}" --label "$LABEL"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Find rising keywords
        if: steps.fetch.outputs.skipped != 'true'
        run: |
          COUNT=$(ls content/seo/snapshots/*.json 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 2 ]; then
            echo "スナップショットが2未満のため比較スキップ"
            exit 0
          fi
          node scripts/seo/find-rising-keywords.js

      - name: Create Pull Request
        if: steps.fetch.outputs.skipped != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(seo): GSC weekly snapshot'
          title: 'SEO: GSC 週次スナップショット'
          body: |
            Search Console の週次スナップショットと伸びワードです。

            - スナップショット: `content/seo/snapshots/`
            - 機会: `content/seo/opportunities/`
            - 日次下書き (`seo-daily-drafts`) が機会を消費します

            Secrets 未設定時はこの workflow はスキップされます。
          branch: chore/seo-gsc-weekly
          delete-branch: true
