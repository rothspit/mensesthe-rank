name: Publish Scraped Shops

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（DBを更新しない）'
        required: false
        default: false
        type: boolean
      limit:
        description: '公開件数の上限（空欄ですべて）'
        required: false
        type: string

env:
  NODE_VERSION: '20'

jobs:
  publish-shops:
    name: Publish Scraped Shops
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish scraped shops
        id: publish
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          node scripts/publish-scraped-shops.js $ARGS

      - name: Create summary
        if: always()
        run: |
          echo "## 📤 Publish Scraped Shops" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Published: ${{ steps.publish.outputs.published_count || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- Limit: ${{ inputs.limit || 'all' }}" >> $GITHUB_STEP_SUMMARY
