# 週次: Search Console 伸びワード → SEO記事下書き
#
# Secrets:
#   GSC_SERVICE_ACCOUNT_JSON  … Search Console API
#   GSC_SITE_URL              … 例 https://mensesthe-rank.jp/
#   ANTHROPIC_API_KEY         … 本文生成（優先）
#   OPENAI_API_KEY            … 任意（サムネLLM等）

name: SEO Keyword Pipeline

on:
  schedule:
    - cron: '0 1 * * 1' # 月曜 10:00 JST 前後
  workflow_dispatch:
    inputs:
      days:
        description: 'GSC取得日数（API時）'
        required: false
        default: '28'
      generate_limit:
        description: '生成する下書き件数'
        required: false
        default: '5'

permissions:
  contents: write
  pull-requests: write

jobs:
  seo-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Japanese fonts (サムネ用)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save googleapis

      - name: Fetch GSC (API)
        id: fetch
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "GSC_SERVICE_ACCOUNT_JSON 未設定のため API 取得をスキップします（CSV運用可）"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GSC_SITE_URL="${GSC_SITE_URL:-https://mensesthe-rank.jp/}"
          LABEL=$(date -u +%Y-%m-%d)
          node scripts/seo/fetch-gsc-queries.js --api --days "${{ inputs.days || 28 }}" --label "$LABEL"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - name: Find rising keywords
        if: steps.fetch.outputs.skipped != 'true'
        run: |
          COUNT=$(ls content/seo/snapshots/*.json 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -lt 2 ]; then
            echo "スナップショットが2未満のため比較スキップ（次回以降に比較開始）"
            exit 0
          fi
          node scripts/seo/find-rising-keywords.js

      - name: Generate article drafts
        if: steps.fetch.outputs.skipped != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ ! -d content/seo/opportunities ] || [ -z "$(ls content/seo/opportunities/*.json 2>/dev/null)" ]; then
            echo "機会ファイルなし。スキップ"
            exit 0
          fi
          node scripts/seo/generate-keyword-articles.js --execute --limit "${{ inputs.generate_limit || 5 }}"

      - name: Create Pull Request
        if: steps.fetch.outputs.skipped != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(seo): GSC伸びワードから記事下書きを生成'
          title: 'SEO: GSC伸びワード下書き'
          body: |
            Search Console の伸びワードから SEO 記事下書きを自動生成しました。

            - [ ] 下書きを校正する
            - [ ] `src/constants/articles.js` の allowlist に追加する
            - [ ] マージ後に本番デプロイ

            詳細: `content/seo/README.md`
          branch: chore/seo-gsc-drafts
          delete-branch: true
